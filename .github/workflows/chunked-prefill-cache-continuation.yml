name: Cached prefix chunked-prefill exact CPU Llama regression
on:
  push:
    branches:
      - "research/chunked-prefill-cache-continuation-20261013"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tiny-llama-cache-invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official CPU-only Torch
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install exact source and test runner
        run: python -m pip install --disable-pip-version-check -e . pytest pytest-xdist
      - name: Test static/dynamic cache continuation and fresh chunk parity
        run: python -m pytest -q tests/generation/test_chunked_prefill_cached_continuation.py

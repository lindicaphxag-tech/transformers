name: Trainer stop-before-first-step CPU regression

on:
  pull_request:
    branches:
      - fix/trainer-stop-before-first-step-20261018
    paths:
      - ".github/workflows/trainer_stop_before_first_step_cpu.yml"
      - "src/transformers/trainer.py"
      - "tests/trainer/test_trainer.py"
      - "tests/trainer/test_trainer_callback.py"
      - "tests/trainer/trainer_test_utils.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop-control-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install Transformers and focused test dependencies
        run: python -m pip install -e . pytest datasets accelerate parameterized pytest-xdist pytest-rerunfailures
      - name: Run callback stop-before-first-step regression
        run: pytest -q tests/trainer/test_trainer_callback.py -k callback_can_stop_training_before_first_step
      - name: Run finalization stop-before-first-step regression
        run: pytest -q tests/trainer/test_trainer.py -k stop_on_train_begin_finalizes_without_an_optimizer_step

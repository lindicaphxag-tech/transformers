name: Mamba2 bounded state-space scan-cache mathematical parity
on:
  push:
    branches: [research/mamba-cache-dt-limit]
    paths:
      - src/transformers/models/mamba2/modeling_mamba2.py
      - src/transformers/models/zamba2/modeling_zamba2.py
      - tests/models/mamba2/test_cache_dt_limit_parity.py
      - .github/workflows/fork-mamba-cache-dt-parity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-mamba-ssm-cache-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest pytest-xdist parameterized
      - run: |
          python -m pytest -q tests/models/mamba2/test_cache_dt_limit_parity.py tests/models/zamba2/test_cached_dt_limit_parity.py
